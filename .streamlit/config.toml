[server]
enableStaticServing = true
address = "localhost"
port = 8501

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"

[theme]
base = "dark"
primaryColor = "#6366F1"
backgroundColor = "#090D16"
secondaryBackgroundColor = "#111726"
textColor = "#F8FAFC"
font = "sans serif"

[[theme.fontFaces]]
family = "Atkinson Hyperlegible"
url = "/app/static/fonts/atkinson-hyperlegible-latin-400-normal.woff2"
weight = 400
style = "normal"

[[theme.fontFaces]]
family = "Atkinson Hyperlegible"
url = "/app/static/fonts/atkinson-hyperlegible-latin-700-normal.woff2"
weight = 700
style = "normal"

[[theme.fontFaces]]
family = "IBM Plex Mono"
url = "/app/static/fonts/ibm-plex-mono-latin-400-normal.woff2"
weight = 400
style = "normal"
