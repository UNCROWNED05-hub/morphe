[server]
enableStaticServing = true
address = "localhost"
port = 8501

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"

[theme]
base = "dark"
primaryColor = "#5E6AD2"
backgroundColor = "#0D0E10"
secondaryBackgroundColor = "#151619"
textColor = "#E6E8EB"
font = "sans serif"

[[theme.fontFaces]]
family = "Atkinson Hyperlegible"
url = "/app/static/fonts/atkinson-hyperlegible-latin-400-normal.woff2"
weight = 400
style = "normal"

[[theme.fontFaces]]
family = "Atkinson Hyperlegible"
url = "/app/static/fonts/atkinson-hyperlegible-latin-700-normal.woff2"
weight = 700
style = "normal"

[[theme.fontFaces]]
family = "IBM Plex Mono"
url = "/app/static/fonts/ibm-plex-mono-latin-400-normal.woff2"
weight = 400
style = "normal"
